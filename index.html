<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🗾 日本の都市クイズ</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 16px;
    }
    .container { max-width: 820px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 16px; }
    header h1 { font-size: 1.6rem; margin-bottom: 4px; }
    header p { color: var(--muted); font-size: 0.9rem; }
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .stat-label { font-size: 0.78rem; color: var(--muted); }
    .stat-value { font-size: 1.3rem; font-weight: 700; color: var(--primary); }
    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .mode-btn {
      padding: 10px;
      border: 2px solid var(--border);
      background: var(--card);
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .mode-btn.active {
      border-color: var(--primary);
      background: #eff6ff;
      color: var(--primary);
    }
    .quiz-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .progress-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .question-title {
      font-size: 1.45rem;
      font-weight: 800;
      text-align: center;
      margin: 8px 0 14px;
    }
    .map-wrapper {
      position: relative;
      width: 100%;
      height: 430px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      margin-bottom: 12px;
      background: #dbeafe;
      user-select: none;
      touch-action: none;
    }
    #japan-svg { width: 100%; height: 100%; display: block; cursor: crosshair; }
    .map-controls {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .ctrl-btn {
      background: #ffffff;
      color: var(--text);
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
      transition: background 0.15s;
    }
    .ctrl-btn:hover { background: #f1f5f9; }
    .zoom-group { display: flex; gap: 4px; }
    .zoom-group .ctrl-btn { flex: 1; padding: 6px 0; font-size: 1rem; }
    .hint-text {
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .pref-input-area {
      display: flex;
      gap: 8px;
      max-width: 420px;
      margin: 0 auto 12px;
    }
    .pref-input-area input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-next { background: #0f172a; color: #fff; margin-top: 10px; }
    .btn-next:hover { background: #334155; }
    .result-box {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-weight: 700;
      display: none;
    }
    .result-box.correct { display: block; background: #dcfce7; color: var(--success); }
    .result-box.wrong { display: block; background: #fee2e2; color: var(--danger); }
    .hidden { display: none !important; }
    .final-screen { text-align: center; padding: 24px 12px; }
    .final-screen h2 { font-size: 1.5rem; margin-bottom: 12px; }
    .final-score { font-size: 2rem; font-weight: 800; color: var(--primary); margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🗾 日本の都市クイズ</h1>
      <p>白地図で探して、都道府県を当てよう！</p>
    </header>

    <!-- スコア表示 -->
    <div class="stats-bar">
      <div class="stat-box">
        <div class="stat-label">回答数</div>
        <div class="stat-value" id="stat-answered">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">正解数</div>
        <div class="stat-value" id="stat-correct">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">正解率</div>
        <div class="stat-value" id="stat-rate">0%</div>
      </div>
    </div>

    <!-- モード切替 -->
    <div class="mode-tabs">
      <button class="mode-btn active" id="tab-map" onclick="switchMode('map')">📍 地図当て</button>
      <button class="mode-btn" id="tab-pref" onclick="switchMode('pref')">✏ 県名当て</button>
    </div>

    <!-- クイズ本体 -->
    <div class="quiz-card" id="quiz-area">
      <div class="progress-row">
        <span id="q-number">第1問</span>
        <span id="q-remaining">残り27問</span>
      </div>

      <div class="question-title" id="question-text">準備中...</div>

      <!-- 地図エリア（地図当てモード用） -->
      <div id="map-section">
        <div class="map-wrapper" id="map-wrapper">
          <svg id="japan-svg" viewBox="0 0 800 720" preserveAspectRatio="xMidYMid meet"></svg>
          <div class="map-controls">
            <button type="button" class="ctrl-btn" id="reset-view-btn">🔄 視点リセット</button>
            <div class="zoom-group">
              <button type="button" class="ctrl-btn" id="zoom-in-btn" title="拡大">＋</button>
              <button type="button" class="ctrl-btn" id="zoom-out-btn" title="縮小">－</button>
            </div>
          </div>
        </div>
        <p class="hint-text">地図をクリック（タップ）してピンを置いてください。ドラッグで移動、ホイール・ピンチ・ダブルクリック・＋－で拡大できます。</p>
        <button class="btn btn-primary" id="submit-map-btn" disabled>ここに決定</button>
      </div>

      <!-- 県名入力エリア（県名当てモード用） -->
      <div id="pref-section" class="hidden">
        <p class="hint-text">この市・町がある都道府県を入力してください（例：北海道、東京都、大阪府、京都府、〇〇県）。</p>
        <div class="pref-input-area">
          <input type="text" id="pref-input" placeholder="都道府県名を入力..." autocomplete="off" />
        </div>
        <button class="btn btn-primary" id="submit-pref-btn">解答する</button>
      </div>

      <!-- 判定結果 -->
      <div class="result-box" id="result-box"></div>

      <!-- 次の問題へ -->
      <button class="btn btn-next hidden" id="next-btn">次の問題へ ➔</button>
    </div>

    <!-- 終了画面 -->
    <div class="quiz-card final-screen hidden" id="final-area">
      <h2>🎉 クイズ終了！お疲れさまでした！</h2>
      <div class="final-score" id="final-summary">27問中 0問 正解</div>
      <button class="btn btn-primary" onclick="restartQuiz()">もう一度最初から遊ぶ</button>
    </div>
  </div>

  <script>

      if (lat < 27.5 && lng < 132) {
        return { x: 30 + (lng - 123.0) * 27, y: 130 - (lat - 24.0) * 27 };
      }
      return { x: 130 + (lng - 129.0) * 38, y: 660 - (lat - 30.5) * 44 };
    }

      svg.appendChild(createSvgEl("rect", {
        x: 18, y: 34, width: 175, height: 112,
        fill: "#eff6ff", stroke: "#93c5fd", "stroke-width": 1.5 * k, rx: 6
      }));

      // 都道府県の白地図
      PREF_SHAPES.forEach(function(pref) {
        svg.appendChild(createSvgEl("path", {
          d: pref.d,
          fill: pref.name === answerPref ? "#fef9c3" : "#ffffff",
          stroke: "#64748b",
          "stroke-width": 0.9 * k,
          "stroke-linejoin": "round"
        }));
      });

      // 都道府県名ラベル
      PREF_SHAPES.forEach(function(pref) {
        const text = createSvgEl("text", {
          x: pref.lx,
          y: pref.ly,
          "text-anchor": "middle",
          "dominant-baseline": "central",
          fill: "#475569",
          "font-size": 9 * k,
          "font-weight": "700",
          "pointer-events": "none"
        });
        text.textContent = pref.name;
        svg.appendChild(text);
      });

      // 正解ラインと正解ピン（回答後）
      if (guessPoint && answerPoint) {
        svg.appendChild(createSvgEl("line", {
          x1: guessPoint.x, y1: guessPoint.y,
          x2: answerPoint.x, y2: answerPoint.y,
          stroke: "#2563eb",
          "stroke-width": 2.5 * k,
          "stroke-dasharray": (6 * k) + "," + (4 * k)
        }));
        svg.appendChild(createSvgEl("circle", {
          cx: answerPoint.x, cy: answerPoint.y, r: 7 * k,
          fill: "#dc2626", stroke: "#ffffff", "stroke-width": 2 * k
        }));
      }

      // プレイヤーの予想ピン
      if (guessPoint) {
        svg.appendChild(createSvgEl("circle", {
          cx: guessPoint.x, cy: guessPoint.y, r: 7 * k,
          fill: "#2563eb", stroke: "#ffffff", "stroke-width": 2 * k
        }));
      }
    }

    function getScale() {
      const rect = svg.getBoundingClientRect();
      if (!rect.width || !rect.height) return 1.67;
      return Math.max(viewBox.w / rect.width, viewBox.h / rect.height);
    }

    function clientToSvgCoords(clientX, clientY) {
      const rect = svg.getBoundingClientRect();
      // preserveAspectRatio="xMidYMid meet" の補正
      const scale = getScale();
      const offsetX = (rect.width * scale - viewBox.w) / 2;
      const offsetY = (rect.height * scale - viewBox.h) / 2;
      return {
        x: viewBox.x + (clientX - rect.left) * scale - offsetX,
        y: viewBox.y + (clientY - rect.top) * scale - offsetY
      };
    }

    // ---- 視点のアニメーション ----
    let animId = null;
    function cancelAnim() {
      if (animId) { cancelAnimationFrame(animId); animId = null; }
    }
    function animateTo(target, duration) {
      cancelAnim();
      const from = { x: viewBox.x, y: viewBox.y, w: viewBox.w, h: viewBox.h };
      const t0 = performance.now();
      function step(now) {
        let t = Math.min(1, (now - t0) / duration);
        const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        viewBox = {
          x: from.x + (target.x - from.x) * e,
          y: from.y + (target.y - from.y) * e,
          w: from.w + (target.w - from.w) * e,
          h: from.h + (target.h - from.h) * e
        };
        renderMap();
        animId = t < 1 ? requestAnimationFrame(step) : null;
      }
      animId = requestAnimationFrame(step);
    }

    // ---- 都道府県の範囲(答え合わせ時のズーム用) ----
    function shortPref(name) {
      return name === "北海道" ? name : name.replace(/[都府県]$/, "");
    }
    function pieceBBoxes(pref) {
      return pref.d.split("M").filter(Boolean).map(function(part) {
        const nums = part.match(/-?\d+\.?\d*/g).map(Number);
        let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
        for (let i = 0; i + 1 < nums.length; i += 2) {
          x0 = Math.min(x0, nums[i]); x1 = Math.max(x1, nums[i]);
          y0 = Math.min(y0, nums[i + 1]); y1 = Math.max(y1, nums[i + 1]);
        }
        return { x0: x0, y0: y0, x1: x1, y1: y1 };
      });
    }
    function zoomToAnswerPref(q) {
      const pref = PREF_SHAPES.find(function(p) { return p.name === shortPref(q.pref); });
      if (!pref) return;
      const pieces = pieceBBoxes(pref);
      let box;
      if (pref.name === "沖縄") {
        box = pieces.reduce(function(a, b) {
          return { x0: Math.min(a.x0, b.x0), y0: Math.min(a.y0, b.y0), x1: Math.max(a.x1, b.x1), y1: Math.max(a.y1, b.y1) };
        });
      } else {
        // 正解地点を含む陸地(本土など)の範囲を使う
        box = pieces.find(function(b) {
          return answerPoint.x >= b.x0 && answerPoint.x <= b.x1 && answerPoint.y >= b.y0 && answerPoint.y <= b.y1;
        });
        if (!box) {
          box = pieces.reduce(function(a, b) {
            return (b.x1 - b.x0) * (b.y1 - b.y0) > (a.x1 - a.x0) * (a.y1 - a.y0) ? b : a;
          });
        }
        box = { x0: box.x0, y0: box.y0, x1: box.x1, y1: box.y1 };
      }
      // 予想ピンが近くにあれば一緒に収める
      if (guessPoint) {
        const mw = box.x1 - box.x0, mh = box.y1 - box.y0;
        if (guessPoint.x > box.x0 - mw && guessPoint.x < box.x1 + mw &&
            guessPoint.y > box.y0 - mh && guessPoint.y < box.y1 + mh) {
          box.x0 = Math.min(box.x0, guessPoint.x); box.x1 = Math.max(box.x1, guessPoint.x);
          box.y0 = Math.min(box.y0, guessPoint.y); box.y1 = Math.max(box.y1, guessPoint.y);
        }
      }
      const rect = svg.getBoundingClientRect();
      const aspect = rect.width && rect.height ? rect.width / rect.height : 1.8;
      let w = Math.max(60, (box.x1 - box.x0) * 1.35);
      let h = Math.max(40, (box.y1 - box.y0) * 1.35);
      if (w / h < aspect) { w = h * aspect; } else { h = w / aspect; }
      animateTo({ x: (box.x0 + box.x1) / 2 - w / 2, y: (box.y0 + box.y1) / 2 - h / 2, w: w, h: h }, 700);
    }

    // ---- マウス・タッチ操作(クリックでピン、ドラッグで移動、ホイール/ピンチで拡大) ----
    const pointers = new Map();
    let pinchDist = 0;
    let wasPinch = false;
    function pointerDistance() {
      const v = Array.from(pointers.values());
      return Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y);
    }

    svg.addEventListener("pointerdown", function(e) {
      cancelAnim();
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      svg.setPointerCapture(e.pointerId);
      if (pointers.size === 1) {
        isDragging = true;
        hasMoved = false;
        wasPinch = false;
        dragStart = { x: e.clientX, y: e.clientY };
      } else if (pointers.size === 2) {
        wasPinch = true;
        hasMoved = true;
        pinchDist = pointerDistance();
      }
    });

    svg.addEventListener("pointermove", function(e) {
      const prev = pointers.get(e.pointerId);
      if (!prev) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size >= 2) {
        const v = Array.from(pointers.values());
        const dist = pointerDistance();
        if (pinchDist > 0 && dist > 0) {
          const c = clientToSvgCoords((v[0].x + v[1].x) / 2, (v[0].y + v[1].y) / 2);
          zoomAt(pinchDist / dist, c.x, c.y);
        }
        pinchDist = dist;
        return;
      }
      if (!isDragging) return;
      if (Math.abs(e.clientX - dragStart.x) > 4 || Math.abs(e.clientY - dragStart.y) > 4) {
        hasMoved = true;
      }
      if (hasMoved) {
        const scale = getScale();
        viewBox.x -= (e.clientX - prev.x) * scale;
        viewBox.y -= (e.clientY - prev.y) * scale;
        renderMap();
      }
    });

    function endPointer(e, canPlace) {
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinchDist = 0;
      if (pointers.size === 0) {
        isDragging = false;
        if (canPlace && !hasMoved && !wasPinch && !isAnswered && currentMode === "map") {
          const pt = clientToSvgCoords(e.clientX, e.clientY);
          const geo = svgToGeo(pt.x, pt.y);
          guessPoint = { x: pt.x, y: pt.y, lat: geo.lat, lng: geo.lng };
          document.getElementById("submit-map-btn").disabled = false;
          renderMap();
        }
      }
    }
    svg.addEventListener("pointerup", function(e) { endPointer(e, true); });
    svg.addEventListener("pointercancel", function(e) { endPointer(e, false); });

    // ---- ズーム(指定した地点を中心に拡大・縮小) ----
    function zoomAt(factor, px, py) {
      const minW = 25, maxW = 1400;
      let f = factor;
      if (viewBox.w * f < minW) f = minW / viewBox.w;
      if (viewBox.w * f > maxW) f = maxW / viewBox.w;
      viewBox = {
        x: px - (px - viewBox.x) * f,
        y: py - (py - viewBox.y) * f,
        w: viewBox.w * f,
        h: viewBox.h * f
      };
      renderMap();
    }
    function zoomCenter(f) {
      cancelAnim();
      zoomAt(f, viewBox.x + viewBox.w / 2, viewBox.y + viewBox.h / 2);
    }

    svg.addEventListener("wheel", function(e) {
      e.preventDefault();
      cancelAnim();
      const d = Math.max(-300, Math.min(300, e.deltaY));
      const c = clientToSvgCoords(e.clientX, e.clientY);
      zoomAt(Math.exp(d * 0.004), c.x, c.y);
    }, { passive: false });

    // ダブルクリック(ダブルタップ)でその場所を拡大
    svg.addEventListener("dblclick", function(e) {
      e.preventDefault();
      cancelAnim();
      const c = clientToSvgCoords(e.clientX, e.clientY);
      zoomAt(0.5, c.x, c.y);
    });

    document.getElementById("zoom-in-btn").addEventListener("click", function() { zoomCenter(0.55); });
    document.getElementById("zoom-out-btn").addEventListener("click", function() { zoomCenter(1.8); });

    // 視点リセットボタン
    document.getElementById("reset-view-btn").addEventListener("click", function() {
      cancelAnim();
      viewBox = { x: DEFAULT_VIEW.x, y: DEFAULT_VIEW.y, w: DEFAULT_VIEW.w, h: DEFAULT_VIEW.h };
      renderMap();
    });

    function shuffle(array) {
      const arr = array.slice();
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = arr[i];
        arr[i] = arr[j];
        arr[j] = temp;
      }
      return arr;
    }

    function startQuiz() {
      questions = shuffle(CITIES).slice(0, TOTAL_QUESTIONS);
      currentIndex = 0;
      answeredCount = 0;
      correctCount = 0;
      updateStats();
      document.getElementById("quiz-area").classList.remove("hidden");
      document.getElementById("final-area").classList.add("hidden");
      loadQuestion();
    }

    function restartQuiz() {
      startQuiz();
    }

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById("tab-map").classList.toggle("active", mode === "map");
      document.getElementById("tab-pref").classList.toggle("active", mode === "pref");
      document.getElementById("map-section").classList.toggle("hidden", mode !== "map");
      document.getElementById("pref-section").classList.toggle("hidden", mode !== "pref");
      loadQuestion();
    }

    function loadQuestion() {
      isAnswered = false;
      const q = questions[currentIndex];
      document.getElementById("q-number").textContent = "第" + (currentIndex + 1) + "問";
      document.getElementById("q-remaining").textContent = "残り" + (TOTAL_QUESTIONS - currentIndex) + "問";

      const resultBox = document.getElementById("result-box");
      resultBox.className = "result-box";
      resultBox.textContent = "";
      document.getElementById("next-btn").classList.add("hidden");

      if (currentMode === "map") {
        document.getElementById("question-text").textContent = q.name + "はどこ？";
        document.getElementById("submit-map-btn").disabled = true;
        cancelAnim();
        guessPoint = null;
        answerPoint = null;
        viewBox = { x: DEFAULT_VIEW.x, y: DEFAULT_VIEW.y, w: DEFAULT_VIEW.w, h: DEFAULT_VIEW.h };
        renderMap();
      } else {
        document.getElementById("question-text").textContent = q.name + "は何都道府県？";
        const input = document.getElementById("pref-input");
        input.value = "";
        input.disabled = false;
        document.getElementById("submit-pref-btn").disabled = false;
        input.focus();
      }
    }

    function calcDistanceKm(lat1, lng1, lat2, lng2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLng / 2) * Math.sin(dLng / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    document.getElementById("submit-map-btn").addEventListener("click", function() {
      if (isAnswered || !guessPoint) return;
      isAnswered = true;
      document.getElementById("submit-map-btn").disabled = true;

      const q = questions[currentIndex];
      const ansSvg = geoToSvg(q.lat, q.lng);
      answerPoint = { x: ansSvg.x, y: ansSvg.y, lat: q.lat, lng: q.lng };
      renderMap();
      zoomToAnswerPref(q);

      const dist = calcDistanceKm(guessPoint.lat, guessPoint.lng, q.lat, q.lng);
      const isCorrect = dist <= 60;
      answeredCount++;
      if (isCorrect) correctCount++;
      updateStats();

      const resultBox = document.getElementById("result-box");
      if (isCorrect) {
        resultBox.className = "result-box correct";
        resultBox.textContent = "⭕ 正解！誤差 約" + dist.toFixed(1) + " km（" + q.pref + q.name + "）";
      } else {
        resultBox.className = "result-box wrong";
        resultBox.textContent = "❌ 惜しい！誤差 約" + dist.toFixed(1) + " km（正解は赤いピンの位置：" + q.pref + q.name + "）";
      }
      document.getElementById("next-btn").classList.remove("hidden");
    });

    function checkPrefAnswer() {
      if (isAnswered) return;
      const input = document.getElementById("pref-input");
      const val = input.value.trim();
      if (!val) return;
      isAnswered = true;
      input.disabled = true;
      document.getElementById("submit-pref-btn").disabled = true;

      const q = questions[currentIndex];
      const normalize = function(s) { return s.replace(/(都|府|県)$/, ""); };
      const isCorrect = val === q.pref || normalize(val) === normalize(q.pref);
      answeredCount++;
      if (isCorrect) correctCount++;
      updateStats();

      const resultBox = document.getElementById("result-box");
      if (isCorrect) {
        resultBox.className = "result-box correct";
        resultBox.textContent = "⭕ 正解！ " + q.name + " は「" + q.pref + "」です。";
      } else {
        resultBox.className = "result-box wrong";
        resultBox.textContent = "❌ 不正解… 正解は「" + q.pref + "」です。";
      }
      document.getElementById("next-btn").classList.remove("hidden");
    }

    document.getElementById("submit-pref-btn").addEventListener("click", checkPrefAnswer);
    document.getElementById("pref-input").addEventListener("keydown", function(e) {
      if (e.key === "Enter") checkPrefAnswer();
    });

    document.getElementById("next-btn").addEventListener("click", function() {
      currentIndex++;
      if (currentIndex >= TOTAL_QUESTIONS) {
        document.getElementById("quiz-area").classList.add("hidden");
        document.getElementById("final-area").classList.remove("hidden");
        document.getElementById("final-summary").textContent = TOTAL_QUESTIONS + "問中 " + correctCount + "問 正解（正解率 " + Math.round((correctCount / TOTAL_QUESTIONS) * 100) + "%）";
      } else {
        loadQuestion();
      }
    });

    function updateStats() {
      document.getElementById("stat-answered").textContent = answeredCount;
      document.getElementById("stat-correct").textContent = correctCount;
      const rate = answeredCount === 0 ? 0 : Math.round((correctCount / answeredCount) * 100);
      document.getElementById("stat-rate").textContent = rate + "%";
    }

    // 即時起動
    startQuiz();
  </script>
</body>
</html>
